---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: e8f7d69b957a30acb2c875078d5fd012de24b64c  # frozen: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 166c7027240501d219155fe71ad9817f8d69237b  # frozen: v0.0.80
    hooks:
      - id: ty

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: e8b4e28241a9ae8296ba6e4a491b5da4eda73283  # frozen: 3.11.1
    hooks:
      - id: editorconfig-checker

  - repo: .
    rev: HEAD
    hooks:
      - id: link
        args: ["agents", "--to", "claude-code"]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 4f783b6470be305483837130a5be2e21ed7ff52b  # frozen: 0.12.13
    hooks:
      - id: uv-lock
