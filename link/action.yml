name: AICfg Link
author: TomerFi
description: Link AI assistant configurations
branding:
  icon: "link"
  color: "blue"

inputs:
  source:
    description: "Source assistant to link from"
    required: true
  target:
    description: "Target assistants to link to (comma-separated)"
    required: true
  verbose:
    description: "Print informational messages"
    default: "false"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      continue-on-error: true
      with:
        enable-cache: false

    - name: Run aicfg link
      shell: bash
      run: |
        uvx aicfg link "${{ inputs.source }}" \
          --to "${{ inputs.target }}" \
          --ci \
          ${{ inputs.verbose && '--verbose' || '' }}
